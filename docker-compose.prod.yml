# ============================================================
#  Trade API — Docker Compose PRODUCTION
#  Usage : docker compose -f docker-compose.prod.yml up -d --build
#
#  Prerequis :
#   • Fichier .env rempli (copie de .env.example)
#   • Nginx + certificat Let's Encrypt sur l'hote (deploy/setup-server.sh)
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:          ${DB_NAME}
      POSTGRES_USER:        ${DB_USER}
      POSTGRES_PASSWORD:    ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts d'init optionnels (extensions...), executes au premier demarrage
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    # PAS d'exposition du port en production : accessible uniquement via le
    # reseau Docker
    expose:
      - "5432"
    networks:
      - trade_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: trade-api:latest
    container_name: trade_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Nginx ecoute sur 443 et proxifie vers 127.0.0.1:8000 : publie
    # uniquement sur la boucle locale pour que Nginx seul y accede.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      ENV:        production
      PORT:       8000
      DB_HOST:    postgres
      DB_PORT:    5432
      LOG_DIR:    /app/logs
      DATA_DIR:   /var/data/data
      MODEL_DIR:  /var/data/models
      RESULT_DIR: /var/data/results
    volumes:
      # Historiques de cours, modele entraine, resultats
      - trade_data:/var/data
      - logs_data:/app/logs
    networks:
      - trade_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # L'entrainement du modele (xgboost) tourne dans ce conteneur.
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

networks:
  trade_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  trade_data:
    driver: local
  logs_data:
    driver: local
