# ============================================================
#  Trade API — Configuration Nginx (VPS Ubuntu)
#  Remplacer : YOUR_DOMAIN par le vrai domaine (ex : api.finadvisor.app)
#  Deposer dans : /etc/nginx/sites-available/trade-api
#  Activer via  : ln -sf /etc/nginx/sites-available/trade-api \
#                        /etc/nginx/sites-enabled/trade-api
#  (deploy/setup-server.sh le fait automatiquement)
# ============================================================

upstream trade_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (generes par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── TLS durci ─────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Headers securite ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Taille max des requetes : import d'un historique .xlsx ───────────────
    client_max_body_size  20M;
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          60s;

    # ── Gzip (les historiques de graphique sont volumineux) ──────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json text/plain text/html;

    # ── Health check direct (pas de log) ─────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://trade_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── Proxy vers l'API ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://trade_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Necessaires pour l'IP reelle du client (limites de debit, logs)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'assistant (API Claude) et le rafraichissement des cours peuvent
        # prendre plus d'une minute.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/trade-api-access.log combined;
    error_log  /var/log/nginx/trade-api-error.log warn;
}
