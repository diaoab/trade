name: Deploy to VPS

# Deploiement apres le succes de la CI sur main : jamais de code dont les
# tests echouent en production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Le build de l'image (pandas, xgboost, scikit-learn) depasse les
          # 10 minutes par defaut d'appleboy/ssh-action.
          command_timeout: "30m"
          script: |
            set -e
            cd /var/www/trade-api

            # --rebase : le VPS peut avoir des commits locaux (config propre
            # a la machine, jamais pousses), rejoues par-dessus main.
            git pull --rebase origin main

            # Rebuild du backend seul (PostgreSQL reste intact) ; les
            # migrations Alembic tournent au demarrage du conteneur.
            docker compose -f docker-compose.prod.yml up -d --build backend

            # Attendre que l'API reponde
            for i in $(seq 1 30); do
              curl -fs http://127.0.0.1:8000/health && exit 0
              sleep 2
            done
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1
