# Migrations de la base des comptes (api/models).
#   python -m alembic upgrade head                      appliquer
#   python -m alembic revision --autogenerate -m "..."  nouvelle migration
#   python -m alembic downgrade -1                      annuler la derniere
# L'adresse de la base vient de api.config.settings (DATABASE_URL ou DB_*).

[alembic]
script_location = api/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
