# Financial AI Advisor — "Trading terminal" dark theme
# Near-black charcoal + gold accent, distinctive from generic slate/blue
# SaaS dashboards. Semantic green/red kept for gains/losses.

[theme]
base = "dark"
primaryColor = "#E3B341"             # Warm gold — distinctive, evokes finance
backgroundColor = "#0B0E13"          # Near-black charcoal
secondaryBackgroundColor = "#161B23" # Card/widget background
codeBackgroundColor = "#161B23"
textColor = "#EDEFF2"
linkColor = "#E3B341"
borderColor = "#262D38"
codeTextColor = "#C7CDD6"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Typography
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors
greenColor = "#3ECF8E"   # Gains
redColor = "#F0576B"     # Losses
yellowColor = "#E3B341"  # Warnings (matches primary gold)
orangeColor = "#F0954D"  # Risk / alerts
blueColor = "#5B9DF9"    # Technical analysis accent
violetColor = "#B18AF8"  # Machine learning accent
grayColor = "#8A94A6"    # Neutral / secondary text

# Chart colors
chartCategoricalColors = [
    "#E3B341",
    "#5B9DF9",
    "#3ECF8E",
    "#B18AF8",
    "#F0576B",
    "#F0954D",
    "#4DD4E8",
    "#8A94A6",
]

# Sequential colors (gold gradient, for heatmaps)
chartSequentialColors = [
    "#2B2107",
    "#453410",
    "#6B4F18",
    "#916A1F",
    "#B7862A",
    "#D3A036",
    "#E3B341",
    "#EBC569",
    "#F3D89A",
    "#FAECC9",
]

# Dataframe styling
dataframeBorderColor = "#262D38"
dataframeHeaderBackgroundColor = "#161B23"

# Sidebar
[theme.sidebar]
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#161B23"
codeBackgroundColor = "#161B23"
textColor = "#EDEFF2"
borderColor = "#262D38"
primaryColor = "#E3B341"
