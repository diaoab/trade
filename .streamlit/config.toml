# Financial AI Advisor — "Neon glass" dark theme
# Deep violet-black glass background (glow dashboards) + neon green
# terminal accent (technical/gains) + rose-pink accent (risk/losses),
# rounded pill widgets. Distinctive from the earlier gold/charcoal look.

[theme]
base = "dark"
primaryColor = "#A78BFA"             # Vivid violet — buttons, links, active elements
backgroundColor = "#0A0812"          # Near-black with a violet undertone
secondaryBackgroundColor = "#161221" # Card/widget background, violet-tinted charcoal
codeBackgroundColor = "#161221"
textColor = "#F1EDFB"
linkColor = "#A78BFA"
borderColor = "#2A2340"
codeTextColor = "#D8D2EC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "full"

# Typography
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors
greenColor = "#00E68A"   # Gains — neon terminal green
redColor = "#FF4D6D"     # Losses — rose-pink
yellowColor = "#FFC857"  # Warnings
orangeColor = "#FF8A5B"  # Risk / alerts
blueColor = "#4DD4F0"    # Technical analysis accent — cyan
violetColor = "#C084FC"  # Machine learning accent
grayColor = "#9089A8"    # Neutral / secondary text

# Chart colors
chartCategoricalColors = [
    "#A78BFA",
    "#00E68A",
    "#FF4D6D",
    "#4DD4F0",
    "#FFC857",
    "#C084FC",
    "#FF8A5B",
    "#9089A8",
]

# Sequential colors (violet -> pink glow gradient, for heatmaps)
chartSequentialColors = [
    "#1B1429",
    "#2C1E42",
    "#3D285C",
    "#4F3277",
    "#603C91",
    "#7F4FB0",
    "#A163C8",
    "#C77EDB",
    "#E29BE8",
    "#F5C2F0",
]

# Dataframe styling
dataframeBorderColor = "#2A2340"
dataframeHeaderBackgroundColor = "#161221"

# Sidebar
[theme.sidebar]
backgroundColor = "#0A0812"
secondaryBackgroundColor = "#161221"
codeBackgroundColor = "#161221"
textColor = "#F1EDFB"
borderColor = "#2A2340"
primaryColor = "#A78BFA"
